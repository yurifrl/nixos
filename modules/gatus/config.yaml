endpoints:
  - name: ArgoCD
    group: Live
    url: https://argocd.syscd.live
    interval: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
      - "[BODY] == pat(*<title>Argo CD</title>*)"
    headers:
      "CF-Access-Client-Id": "$CF_ACCESS_CLIENT_ID"
      "CF-Access-Client-Secret": "$CF_ACCESS_CLIENT_SECRET"
    alerts:
      - type: discord

  - name: foundryvtt
    group: Live
    url: https://rpg.syscd.live
    interval: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
      - "[BODY] == pat(*<title>Argo CD</title>*)"
    headers:
      "CF-Access-Client-Id": "$CF_ACCESS_CLIENT_ID"
      "CF-Access-Client-Secret": "$CF_ACCESS_CLIENT_SECRET"
    alerts:
      - type: discord 

  - name: OBS Stream
    group: Live
    url: https://obs.syscd.live/obs/index.m3u8
    interval: 10s
    conditions:
      - "[STATUS] == 302" # 302 = tunnel up (Cloudflare Access redirect); Error 1033 = 530
      - "[RESPONSE_TIME] < 2000"
    client:
      ignore-redirect: true # don't follow to the Access login (that's a 200)
    alerts:
      - type: discord
        failure-threshold: 30 # ~5min: macintel01 blips self-heal in 1-2min, only page on sustained outage

  - name: Alertmanager
    group: Tech
    url: https://alertmanager.syscd.tech/-/healthy
    interval: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
      - "[BODY] == OK"
    alerts:
      - type: discord

  - name: Home Assistant
    group: Tech
    url: https://ha.syscd.tech
    # url: https://ha.syscd.tech/manifest.json
    interval: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
      - "[BODY] == pat(*<title>Home Assistant</title>*)"
    alerts:
      - type: discord

  - name: Prometheus
    group: Tech
    url: https://prometheus.syscd.tech/-/healthy
    interval: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
      - "[BODY] == Prometheus Server is Healthy."
    alerts:
      - type: discord

  # Dead-man's-switch for VictoriaMetrics INGESTION (not just liveness). The
  # /-/healthy check above stays 200 even when vmsingle flips to read-only on a
  # full disk and silently stops ingesting - the exact failure that went
  # undetected because the in-cluster disk alert is evaluated by vmalert against
  # vmsingle itself (it can't alert on its own storage death). An external
  # freshness query catches it: count(up) returns a non-empty result only while
  # fresh samples land; a read-only / dead-ingestion vmsingle returns
  # "result":[]. See .agents/postmortems/2026-07-11-vmsingle-storage-readonly.
  - name: VictoriaMetrics Ingestion
    group: Tech
    url: "https://prometheus.syscd.tech/api/v1/query?query=count(up)"
    interval: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
      - '[BODY] == pat(*"result":[{*)' # non-empty vector; empty => ingestion dead/read-only
    alerts:
      - type: discord
        failure-threshold: 30 # ~5min: ride out transient query blips, page on sustained ingestion loss

  - name: zigbee2mqtt
    group: Tech
    url: https://zigbee2mqtt.syscd.tech
    interval: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
      - "[BODY] == pat(*<title>Zigbee2MQTT</title>*)"
    alerts:
      - type: discord

  # Xyz
  - name: Teleport
    group: Xyz
    url: https://syscd.xyz/webapi/ping
    interval: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
      - "[BODY].proxy.kube.enabled == true"
    alerts:
      - type: discord

  # Tailnet node reachability (gatus runs on digitalocean-gatus-01, itself on the
  # tailnet). Catches a node silently leaving the tailnet while still k8s-Ready.
  # See .agents/postmortems/2026-07-05-pc01-tailscale-flag-drift-crashloop/PM.md
  # failure-threshold 12 (~2min at 10s) rides out reboots/re-renders.
  # Roaming laptops (macarm01/macintel01) excluded on purpose - they go offline.
  - name: Tailnet pc01
    group: Tech
    url: icmp://100.101.182.40
    interval: 10s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord
        failure-threshold: 12

  - name: Tailnet dell01
    group: Tech
    url: icmp://100.82.148.37
    interval: 10s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord
        failure-threshold: 12

  - name: Tailnet tp1
    group: Tech
    url: icmp://100.90.9.55
    interval: 10s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord
        failure-threshold: 12

  - name: Tailnet tp4
    group: Tech
    url: icmp://100.112.10.120
    interval: 10s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord
        failure-threshold: 12

  # Httpbin
  - name: Httpbin Cloudflare NO Token
    group: Httpbin
    url: https://httpbin.syscd.live/status/200
    interval: 10s
    conditions:
      - "[STATUS] == 302"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: discord
    client:
      ignore-redirect: true # Need this otherwise cloudflare will redirect to the login page and that's a 200

  - name: Httpbin Cloudflare With Token
    group: Httpbin
    url: https://httpbin.syscd.live/status/200
    interval: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
    headers:
      "CF-Access-Client-Id": "$CF_ACCESS_CLIENT_ID"
      "CF-Access-Client-Secret": "$CF_ACCESS_CLIENT_SECRET"
    alerts:
      - type: discord

  - name: Httpbin Via Tailscale
    group: Httpbin
    url: https://httpbin.syscd.tech/status/200
    interval: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: discord

  # - name: Httpbin Via bind9
  #   group: Httpbin
  #   url: https://httpbin.syscd.dev/status/200
  #   client:
  #     dns-resolver: "tcp://192.168.68.200:53"
  #   conditions:
  #     - "[STATUS] == 200"
  #     - "[RESPONSE_TIME] < 2000"
  #   alerts:
  #     - type: discord

web:
  port: 8080
  title: "Syscd Status Dashboard"

alerting:
  discord:
    webhook-url: "$DISCORD_WEBHOOK_URL"
    default-alert:
      send-on-resolved: false
      failure-threshold: 6
      success-threshold: 3

