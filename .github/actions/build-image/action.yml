name: 'Build NixOS Image'
description: 'Build a NixOS image and upload it to GCS (optionally register a DigitalOcean image)'

inputs:
  image-name:
    description: 'NixOS configuration to build (gatus, foundry, workstation)'
    required: true
  build-target:
    description: 'system.build attribute to build (digitalOceanImage or proxmoxImage)'
    required: false
    default: 'digitalOceanImage'
  object-name:
    description: 'GCS object basename to upload the qcow2.bz2 as'
    required: true
  create-do-image:
    description: 'Whether to register a DigitalOcean custom image from the upload'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        flakehub: false

    - name: Enable Nix Flakes
      shell: bash
      run: |
        mkdir -p ~/.config/nix
        echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf

    - name: Cache Nix store
      uses: nix-community/cache-nix-action@v6
      with:
        primary-key: "${{ runner.os }}-nix-${{ inputs.image-name }}-${{ hashFiles('**/*.nix') }}"
        paths: |
          /nix/store
          /nix-cache

    - name: Create deploy.json
      shell: bash
      run: |
        printf '%s\n' '${{ env.DEPLOY_NIX_JSON }}' > deploy.json

    - name: Build NixOS Image
      shell: bash
      run: |
        echo "Building ${{ inputs.image-name }} (${{ inputs.build-target }})..."
        nix build .#nixosConfigurations.${{ inputs.image-name }}.config.system.build.${{ inputs.build-target }}

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: "${{ env.WIF_PROVIDER }}"
        service_account: "${{ env.WIF_SERVICE_ACCOUNT }}"

    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: "${{ env.GCP_PROJECT_ID }}"

    - name: Configure gsutil
      shell: bash
      run: |
        echo "[GSUtil]
        parallel_composite_upload_threshold = 150M" > ~/.boto

    - name: Upload to GCS
      shell: bash
      run: |
        NIXOS_IMAGE_NAME="${{ inputs.object-name }}"
        echo "NIXOS_IMAGE_NAME=$NIXOS_IMAGE_NAME" >> $GITHUB_ENV

        cp result/*qcow2.bz2 "$NIXOS_IMAGE_NAME"

        if [ ! -f "$NIXOS_IMAGE_NAME" ]; then
          echo "Error: Failed to copy nixos image file"
          ls -la result/
          exit 1
        fi

        echo "✅ Found image file: $NIXOS_IMAGE_NAME"
        echo "☁️  GCS Bucket: ${{ env.GCS_BUCKET_NAME }}"

        gsutil cp -v "$NIXOS_IMAGE_NAME" "gs://${{ env.GCS_BUCKET_NAME }}/${NIXOS_IMAGE_NAME}"
        gsutil acl ch -u AllUsers:R "gs://${{ env.GCS_BUCKET_NAME }}/${NIXOS_IMAGE_NAME}"

        IMAGE_URL="https://storage.googleapis.com/${{ env.GCS_BUCKET_NAME }}/$NIXOS_IMAGE_NAME"
        echo "::add-mask::$IMAGE_URL"
        echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

    - name: Install doctl
      if: ${{ inputs.create-do-image == 'true' }}
      uses: digitalocean/action-doctl@v2
      with:
        token: "${{ env.DIGITALOCEAN_ACCESS_TOKEN }}"

    - name: Create DigitalOcean Image
      if: ${{ inputs.create-do-image == 'true' }}
      shell: bash
      run: |
        doctl compute image create "$NIXOS_IMAGE_NAME" \
          --region nyc1 \
          --image-url "$IMAGE_URL" \
          --image-description "NixOS ${{ inputs.image-name }} image built on $(date +%Y-%m-%d)"

    - name: Build Summary
      shell: bash
      run: |
        echo "## ✅ Build Complete: ${{ inputs.image-name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image Object:** \`$NIXOS_IMAGE_NAME\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**GCS:** \`gs://${{ env.GCS_BUCKET_NAME }}/$NIXOS_IMAGE_NAME\`" >> $GITHUB_STEP_SUMMARY
