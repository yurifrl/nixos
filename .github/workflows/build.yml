name: "🏗️ Build & Release"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gatus
            build-target: digitalOceanImage
            create-do-image: "true"
            versioned: "false"
          - image: foundry
            build-target: digitalOceanImage
            create-do-image: "true"
            versioned: "false"
          - image: workstation
            build-target: proxmoxImage
            create-do-image: "false"
            versioned: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || git diff --name-only HEAD~1 HEAD | grep -q "${{ matrix.image }}.version"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image metadata
        if: steps.check.outputs.build == 'true'
        id: meta
        run: |
          V=$(cat "${{ matrix.image }}.version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "${{ matrix.versioned }}" == "true" ]]; then
            # Single stable object name (overwritten each build). The bucket has
            # versioning + a keep-only-current lifecycle rule, so old copies are
            # pruned automatically instead of stacking a ~18GB image per version.
            # Proxmox `import` content type can't decompress on download, so it
            # is published UNCOMPRESSED.
            echo "object-name=${{ matrix.image }}-latest.qcow2" >> "$GITHUB_OUTPUT"
          else
            echo "object-name=nixos-${{ matrix.image }}-$(date +%Y%m%d-%H%M%S).qcow2.bz2" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/build-image
        if: steps.check.outputs.build == 'true'
        with:
          image-name: ${{ matrix.image }}
          build-target: ${{ matrix.build-target }}
          object-name: ${{ steps.meta.outputs.object-name }}
          create-do-image: ${{ matrix.create-do-image }}
        env:
          DEPLOY_NIX_JSON: ${{ secrets.DEPLOY_NIX_JSON }}
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Release
        if: steps.check.outputs.build == 'true'
        run: |
          V=${{ steps.meta.outputs.version }}
          gh release create "${{ matrix.image }}-v${V}" --title "${{ matrix.image }} v${V}" --notes "Built from ${{ github.sha }}" || true
        env:
          GH_TOKEN: ${{ github.token }}
