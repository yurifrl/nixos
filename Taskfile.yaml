version: "3"

dotenv: [.env]

includes:
  remote: ./taskfiles/remote.yaml
  nix: ./taskfiles/nix.yaml
  secrets: ./taskfiles/secrets.yaml
  ssh: ./taskfiles/ssh.yaml
  tf: ./taskfiles/terraform.yaml

# Top-level tasks run LOCALLY on the VM. From-the-Mac wrappers live under remote:*
tasks:
  rebuild:
    desc: 🔁 Pull latest and nixos-rebuild switch for THIS host (git pull as you, switch via sudo)
    cmds:
      - git pull --ff-only
      - sudo nixos-rebuild switch --flake ".#$(hostname)"

  ssh-agent-setup:
    desc: 🔑 Re-point ~/.ssh/agent.sock at the newest forwarded agent socket (fixes git after a herdr reconnect)
    cmds:
      - |
        sock="$(ls -td /tmp/auth-agent*/ 2>/dev/null | head -1)listener.sock"
        if [ -S "$sock" ]; then ln -sf "$sock" "$HOME/.ssh/agent.sock"; echo "agent.sock -> $sock"; else echo "no live forwarded socket found - reconnect with agent forwarding"; fi

  release:
    desc: 🚀 Interactive release - beautiful TUI for version bumps + AI changelogs
    cmds:
      - ./scripts/release

  quick-release:
    desc: ⚡ Quick patch release - auto-bump patch version and push
    cmds:
      - ./scripts/release --quick
